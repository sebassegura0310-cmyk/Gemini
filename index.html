<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tiempo Limitado - Solicita tu Crédito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      /* Degradado rojo intenso arriba hacia rojo vino oscuro abajo */
      background: radial-gradient(circle at 50% 15%, #ff1a1a 0%, #c80000 38%, #6e0000 78%, #360000 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 22px 22px;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    /* Círculo blanco superior con ícono de mano y monedas verdes */
    .logo-circle {
      width: 138px;
      height: 138px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.38);
      animation: floatLogo 3.5s ease-in-out infinite;
    }

    .logo-circle svg {
      width: 92px;
      height: 92px;
    }

    /* Título TIEMPO LIMITADO con rayos */
    .title {
      font-size: 2.35rem;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 20px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
    }

    .bolt {
      display: inline-block;
      filter: drop-shadow(0 2px 6px rgba(250, 204, 21, 0.45));
    }

    /* Párrafo descriptivo */
    .description {
      font-size: 1.08rem;
      font-weight: 400;
      line-height: 1.48;
      color: #f8f8f8;
      margin-bottom: 34px;
      padding: 0 4px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* Botón Principal SOLICITAR */
    .btn-solicitar {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
      color: #111111;
      border: none;
      border-radius: 999px;
      padding: 20px 24px;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45), inset 0 2px 2px rgba(255, 255, 255, 0.9);
      transition: transform 0.14s ease, box-shadow 0.2s ease;
      margin-bottom: 14px;
    }

    .btn-solicitar:active {
      transform: scale(0.96);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.5);
    }

    /* Botón REFERENCIAS justo debajo de SOLICITAR */
    .btn-referencias {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      padding: 15px 24px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.14s ease, background 0.2s ease;
    }

    .btn-referencias:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-referencias:active {
      transform: scale(0.97);
    }

    .footer-register {
      margin-top: 28px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.28);
      letter-spacing: 0.02em;
      user-select: none;
    }

    /* =======================================================
       AVISO DE GOOGLE CHROME / SAFARI (ESTILO CAPTURA 2 EN ROJO)
       ======================================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(14, 2, 2, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
      animation: fadeIn 0.22s ease;
    }

    .modal-overlay.active {
      display: flex;
    }

    .google-card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #3b0808 0%, #240404 100%);
      border: 1px solid rgba(255, 110, 110, 0.25);
      border-radius: 26px;
      padding: 46px 20px 22px;
      box-shadow: 0 26px 65px rgba(0, 0, 0, 0.85);
      text-align: center;
      color: #ffffff;
      position: relative;
      animation: popUp 0.25s ease;
    }

    /* Botón X circular en esquina superior derecha */
    .google-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: #e5e5e5;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .google-close-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Píldora superior de enlace copiado automáticamente */
    .copied-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(22, 101, 52, 0.42);
      border: 1px solid rgba(74, 222, 128, 0.4);
      color: #bbf7d0;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .copied-check {
      background: #22c55e;
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 800;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .google-title {
      font-size: 1.38rem;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .google-desc {
      font-size: 0.88rem;
      line-height: 1.48;
      color: #e5cfcf;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    /* Caja oscura con la URL visible */
    .url-display-box {
      width: 100%;
      background: rgba(12, 2, 2, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 13px;
      padding: 13px 14px;
      font-size: 0.84rem;
      color: #d8c2c2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 14px;
      user-select: all;
    }

    /* Botón verde COPIAR ENLACE AQUÍ */
    .btn-green-copy {
      width: 100%;
      background: linear-gradient(180deg, #16b978 0%, #0ea568 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px 16px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.3);
      margin-bottom: 12px;
      transition: transform 0.14s ease;
    }

    .btn-green-copy:active {
      transform: scale(0.97);
    }

    /* Botón rojo/carmesí INTENTAR ABRIR EN GOOGLE DE NUEVO (reemplazo del morado) */
    .btn-red-retry {
      width: 100%;
      background: linear-gradient(90deg, #dc2626 0%, #b91c1c 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 22px rgba(220, 38, 38, 0.35);
      margin-bottom: 16px;
      transition: transform 0.14s ease;
    }

    .btn-red-retry:active {
      transform: scale(0.97);
    }

    /* Caja inferior con los 3 pasos */
    .steps-box {
      width: 100%;
      background: rgba(12, 2, 2, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 14px 15px;
      text-align: left;
      font-size: 0.83rem;
      line-height: 1.55;
      color: #ebdada;
    }

    .steps-box p {
      margin-bottom: 4px;
    }

    .steps-box p:last-child {
      margin-bottom: 0;
    }

    .steps-box strong {
      color: #ffffff;
      font-weight: 700;
    }

    /* MODAL DE REFERENCIAS */
    .ref-modal-box {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #3b0808 0%, #240404 100%);
      border: 1px solid rgba(255, 110, 110, 0.25);
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.85);
      text-align: left;
      color: #ffffff;
      position: relative;
      animation: popUp 0.25s ease;
    }

    .ref-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .ref-title {
      font-size: 1.12rem;
      font-weight: 700;
    }

    .ref-subtitle {
      font-size: 0.86rem;
      color: #e5cfcf;
      margin-bottom: 14px;
    }

    .
